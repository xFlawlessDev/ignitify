[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
age = { version = "0.11", features = ["armor"] }
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
dotenvy = "0.15"
base64 = "0.23"
bollard = "0.18"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
hickory-resolver = "0.26.1"
hmac = "0.13"
portable-pty = "0.9"
jsonwebtoken = "9.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
resend-rs = { version = "0.29", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.37.2"
subtle = "2"
url = "2.5"
sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio-rustls",
    "sqlite",
] }
thiserror = "2"
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "process",
    "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "debug-embed", "vendored"] }
yaml-rust2 = "0.11"
zeroize = { version = "1", features = ["serde"] }
