# Operator artifact. Replace image digests only after verified release review.
services:
  docker-read-proxy:
    build:
      context: ./socket-proxy
    image: ignitify-docker-socket-proxy:0.1.2
    environment:
      CONTAINERS: 1
      EVENTS: 1
      NETWORKS: 1
      POST: 0
      DELETE: 0
      BUILD: 0
      COMMIT: 0
      EXEC: 0
      IMAGES: 0
      PING: 1
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      VERSION: 1
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=755
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  traefik:
    image: traefik:v3.6.21@sha256:850b1b3484519b12353d9679ec3246e63a42df2cc640bf8e6fa50267d589f5a0
    labels:
      com.ignitify.ingress: traefik
    command:
      - --configFile=/etc/traefik/traefik.yaml
      - --certificatesresolvers.le.acme.email=${IGNITIFY_ACME_EMAIL:-ops@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${IGNITIFY_ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ${IGNITIFY_TRAEFIK_DYNAMIC_DIR:-./dynamic}:/etc/traefik/dynamic:ro
      - ./entrypoint.sh:/ignitify-entrypoint.sh:ro
      - acme:/letsencrypt
    entrypoint:
      - /ignitify-entrypoint.sh
    depends_on:
      - docker-read-proxy
      - ingress-fallback
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - internal
      - ignitify-proxy

  ingress-fallback:
    image: caddy:2.11.4-alpine@sha256:98eb57d882ccd5213d1688764db10c1ca2c58a1ca3a6717a3411ad798f7a423a
    labels:
      com.ignitify.ingress: fallback
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./fallback/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./fallback/404.html:/srv/404.html:ro
      - ./fallback/ignitify-mark.svg:/srv/ignitify-mark.svg:ro
    tmpfs:
      - /config
      - /data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official Caddy binary carries this file capability even though the
    # fallback listens only on the unprivileged port 8080.
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - ignitify-proxy

volumes:
  acme:

networks:
  internal:
    internal: true
  ignitify-proxy:
    name: ignitify-proxy
