name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          frontend=false
          rust=false
          while IFS= read -r path; do
            if [[ "$path" == frontend/* || "$path" == .github/dependabot.yml || "$path" == .github/workflows/* ]]; then
              frontend=true
            fi
            case "$path" in
              crates/*|Cargo.toml|Cargo.lock|.cargo/*|rust-toolchain*|rustfmt.toml|clippy.toml|.github/dependabot.yml|.github/workflows/*)
                rust=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")

          # Rust embeds the frontend bundle, so frontend changes also require
          # the Rust quality gate.
          if [[ "$frontend" == true ]]; then
            rust=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend quality
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm 11.18.0
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --prod

      - name: Check frontend
        working-directory: frontend
        run: pnpm run check

      - name: Test frontend
        working-directory: frontend
        run: pnpm run test

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Share embedded frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust quality
    needs:
      - changes
      - frontend
    if: >-
      always() && needs.changes.outputs.rust == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore embedded frontend bundle
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Node.js for embedded frontend bundle
        if: needs.frontend.result == 'skipped'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build embedded frontend bundle
        if: needs.frontend.result == 'skipped'
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit Rust dependencies
        # Cargo.lock retains SQLx's inactive MySQL/RSA optional dependency;
        # RUSTSEC-2023-0071 has no upstream patch. Keep unmaintained warnings
        # visible without making the audit non-blocking for that category.
        run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  e2e:
    name: E2E smoke
    needs:
      - changes
      - frontend
      - rust
    if: >-
      always() && needs.changes.outputs.frontend == 'true' &&
      needs.frontend.result == 'success' && needs.rust.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm 11.18.0
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Restore frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm run test:e2e:install

      - name: Test frontend E2E
        working-directory: frontend
        run: pnpm run test:e2e
